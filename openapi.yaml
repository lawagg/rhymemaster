openapi: 3.0.3

info:
  title: Рифмомастер API
  version: 3.0.0
  description: |
    Бэкенд веб-приложения для поиска рифм и работы с ритмикой.

servers:
  - url: https://api.rhymemaster.ru/v1
    description: Production
  - url: http://localhost:8000/v1
    description: Local development

tags:
  - name: auth
    description: Регистрация, вход, восстановление пароля
  - name: users
    description: Профиль пользователя
  - name: search
    description: Поиск рифм (простая форма)
  - name: projects
    description: Проекты студии
  - name: words
    description: Слова, предложенные пользователем
  - name: subscription
    description: Подписка и промокоды
  - name: admin
    description: Админ-панель

security:
  - cookieAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                login:
                  type: string
                  minLength: 3
                  maxLength: 64
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email или логин уже заняты

  /auth/login:
    post:
      tags: [auth]
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Успешный вход, cookie установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход
      responses:
        '204':
          description: Cookie удалена

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Подтверждение email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email подтверждён

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Запрос сброса пароля
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Если email существует — письмо отправлено

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Новый пароль по токену
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Пароль обновлён

  /me:
    get:
      tags: [users]
      summary: Текущий пользователь
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /me/profile:
    patch:
      tags: [users]
      summary: Обновить профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /me/limits:
    get:
      tags: [users]
      summary: Остаток поисков
      responses:
        '200':
          description: Лимит и подписка
          content:
            application/json:
              schema:
                type: object
                properties:
                  searches_used:
                    type: integer
                  searches_limit:
                    type: integer
                  period_start:
                    type: string
                    format: date-time
                  has_subscription:
                    type: boolean
                  subscription_expires_at:
                    type: string
                    format: date-time
                    nullable: true

  /search:
    post:
      tags: [search]
      summary: Поиск рифм
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  maxLength: 200
                allow_profanity:
                  type: boolean
                  default: false
                no_repeats:
                  type: boolean
                  default: false
                exact_assonance:
                  type: boolean
                  default: false
                free_combinations:
                  type: boolean
                  default: false
                frequent_words:
                  type: boolean
                  default: false
                semantic_close:
                  type: boolean
                  default: false
                limit:
                  type: integer
                  default: 20
                  maximum: 100
      responses:
        '200':
          description: Список рифм
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  remaining_searches:
                    type: integer
                  query_phonemes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Phoneme'
        '429':
          description: Лимит исчерпан

  /projects:
    get:
      tags: [projects]
      summary: Список проектов
      responses:
        '200':
          description: Проекты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
    post:
      tags: [projects]
      summary: Создать проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /projects/{project_id}:
    get:
      tags: [projects]
      summary: Получить проект
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Проект с холстом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [projects]
      summary: Обновить проект
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                lines:
                  type: array
                  items:
                    $ref: '#/components/schemas/Line'
                marker_templates:
                  type: array
                  items:
                    $ref: '#/components/schemas/MarkerTemplate'
      responses:
        '200':
          description: Обновлён
    delete:
      tags: [projects]
      summary: Удалить проект
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Удалён

  /projects/{project_id}/lines:
    post:
      tags: [projects]
      summary: Добавить строку
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: integer
      responses:
        '201':
          description: Строка добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'

  /projects/{project_id}/lines/{line_id}:
    patch:
      tags: [projects]
      summary: Обновить строку
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: line_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Line'
      responses:
        '200':
          description: Обновлено
    delete:
      tags: [projects]
      summary: Удалить строку
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: line_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Удалена

  /projects/{project_id}/undo:
    post:
      tags: [projects]
      summary: Снимок Undo-стека
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshot:
                  type: object
      responses:
        '204':
          description: Принято

  /projects/{project_id}/search:
    post:
      tags: [projects]
      summary: Поиск в студии
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_color:
                  type: string
                  enum: [green, blue, purple, yellow]
                mode:
                  type: string
                  enum: [find_rhyme, fill_line]
                allow_profanity:
                  type: boolean
                  default: false
                no_repeats:
                  type: boolean
                  default: false
                exact_assonance:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Результаты панели Б
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'

  /words/suggest:
    post:
      tags: [words]
      summary: Предложить слово
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 2
                  maxLength: 30
      responses:
        '202':
          description: Отправлено на модерацию

  /words/my-suggestions:
    get:
      tags: [words]
      summary: Мои предложения
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModerationItem'

  /subscription/activate-promo:
    post:
      tags: [subscription]
      summary: Активировать промокод
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Подписка активирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /subscription/pay:
    post:
      tags: [subscription]
      summary: Оплата через Robokassa
      responses:
        '200':
          description: URL формы
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_url:
                    type: string
                    format: uri

  /subscription/status:
    get:
      tags: [subscription]
      summary: Текущая подписка
      responses:
        '200':
          description: Подписка или null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /admin/moderation:
    get:
      tags: [admin]
      summary: Очередь модерации
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModerationItem'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/moderation/{item_id}:
    patch:
      tags: [admin]
      summary: Обработать слово
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject, edit]
                edited_text:
                  type: string
                stressed_syllable:
                  type: integer
                reason:
                  type: string
      responses:
        '200':
          description: Обработано

  /admin/promo-codes:
    get:
      tags: [admin]
      summary: Список промокодов
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromoCode'
    post:
      tags: [admin]
      summary: Создать промокод
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration_days]
              properties:
                duration_days:
                  type: integer
                  minimum: 1
                  maximum: 365
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCode'
        '429':
          description: Дневной лимит (2 в день)

  /admin/promo-codes/{code_id}:
    delete:
      tags: [admin]
      summary: Отозвать промокод
      parameters:
        - name: code_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Отозван

  /admin/moderation-log:
    get:
      tags: [admin]
      summary: Лог модерации
      responses:
        '200':
          description: Записи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModerationLogEntry'

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  responses:
    Unauthorized:
      description: Не авторизован
    Forbidden:
      description: Доступ запрещён
    NotFound:
      description: Не найдено

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        login:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin]
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Line'
        marker_templates:
          type: array
          items:
            $ref: '#/components/schemas/MarkerTemplate'
        pinned_results:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Line:
      type: object
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        input_text:
          type: string
        tacts:
          type: array
          items:
            $ref: '#/components/schemas/Tact'

    Tact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        mode:
          type: string
          enum: [standard, custom]
        size:
          type: integer
          enum: [2, 3, 4, 6, 8]
        pattern:
          type: string
          nullable: true
        continue_rhythm:
          type: boolean
        cells:
          type: array
          items:
            $ref: '#/components/schemas/Cell'

    Cell:
      type: object
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        state:
          type: string
          enum: [stressed, unstressed, empty]
        text:
          type: string
          nullable: true
        mark:
          type: string
          nullable: true
          enum: [green, blue, purple, yellow]
        mark_group:
          type: integer
          nullable: true

    MarkerTemplate:
      type: object
      properties:
        color:
          type: string
          enum: [green, blue, purple, yellow]
        group_id:
          type: integer
        length:
          type: integer
        states:
          type: string

    Phoneme:
      type: object
      properties:
        type:
          type: string
          enum: [vowel, consonant]
        symbol:
          type: string
        stressed:
          type: boolean
        soft:
          type: boolean
        word_index:
          type: integer

    SearchResult:
      type: object
      properties:
        text:
          type: string
        score:
          type: number
          format: float
        phonemes:
          type: array
          items:
            $ref: '#/components/schemas/Phoneme'
        syllables:
          type: integer
        source:
          type: string
          enum: [manual, navec, word2vec, fasttext, mixed]
        slang_type:
          type: string
          nullable: true
        is_profanity:
          type: boolean
        score_color:
          type: string
          enum: [green, yellow, gray]

    ModerationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        word_text:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        submitted_by:
          type: string
          format: uuid
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ModerationLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        admin_id:
          type: string
          format: uuid
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    PromoCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        duration_days:
          type: integer
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_by:
          type: string
          format: uuid
          nullable: true
        used_at:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean

    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        plan:
          type: string
          enum: [monthly]
        started_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [robokassa, promo, gift]