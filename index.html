<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Студия ритмики — прототип v33</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e; color: #e8e8e8; padding: 20px;
    padding-bottom: 180px; min-height: 100vh;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #9d9dff; }

  .studio-layout { display: flex; gap: 20px; align-items: flex-start; }
  .panel-a { flex: 1; min-width: 650px; padding-bottom: 50px; }
  .panel-b {
    width: 340px; flex-shrink: 0; background: #252540;
    border: 1px solid #3d3d5c; border-radius: 10px; padding: 16px;
    position: sticky; top: 20px; max-height: calc(100vh - 220px);
    display: flex; flex-direction: column;
  }

  /* ЛИПКАЯ ПАНЕЛЬ ИНСТРУМЕНТОВ */
  .toolbar-top {
    display: flex; gap: 8px; margin-bottom: 20px; padding: 10px;
    background: #252540; border-radius: 10px; border: 1px solid #3d3d5c;
    align-items: center; flex-wrap: wrap;
    position: sticky; top: 10px; z-index: 900;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .tool-btn {
    background: #2d2d4a; color: #e8e8e8; border: 2px solid #3d3d5c;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    font-size: 13px; transition: all 0.15s;
  }
  .tool-btn:hover { background: #3d3d5c; }
  .tool-btn.active { background: #5d5dff; border-color: #5d5dff; color: white; }

  .separator { width: 1px; height: 24px; background: #3d3d5c; margin: 0 8px; }

  .panel-b h3 { font-size: 15px; margin-bottom: 16px; color: #9d9dff; }
  .panel-section { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #3d3d5c; }
  .panel-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .section-label { font-size: 11px; color: #8888aa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; }

  .color-palette { display: flex; gap: 14px; margin-bottom: 8px; }
  .color-dot {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: transform 0.15s; position: relative;
  }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.active { border-color: white; box-shadow: 0 0 12px 3px currentColor; }
  .color-dot.green { background: #22ff88; color: #22ff88; }
  .color-dot.blue { background: #3bb2ff; color: #3bb2ff; }
  .color-dot.purple { background: #d44cff; color: #d44cff; }
  .color-dot.yellow { background: #ffd93b; color: #ffd93b; }

  .color-dot .pattern-badge {
    position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: #9d9dff; font-size: 10px; font-weight: 700;
    border-radius: 8px; padding: 1px 6px; border: 1px solid #9d9dff;
    white-space: nowrap; pointer-events: none;
  }

  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #ccc; margin-top: 12px; cursor: pointer; }
  .checkbox-row input { cursor: pointer; width: 16px; height: 16px; accent-color: #5d5dff; }

  .panel-b input[type="text"] {
    width: 100%; background: #1e1e33; color: #e8e8e8;
    border: 1px solid #3d3d5c; border-radius: 6px;
    padding: 8px 12px; font-size: 14px; margin-bottom: 8px;
  }
  .panel-b input[type="text"]:focus { outline: none; border-color: #5d5dff; }

  .btn-group { display: flex; gap: 8px; }
  .btn-group button { flex: 1; }
  .btn-primary { background: #5d5dff; border-color: #5d5dff; color: white; }
  .btn-primary:hover { background: #4a4aff; }
  
  .rhyme-feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .feed-item {
    background: #1e1e33; border: 1px solid #2d2d4a; border-radius: 6px;
    padding: 8px 10px; transition: all 0.15s; display: flex; flex-direction: column; gap: 6px;
  }
  .feed-item:hover { background: #2a2a4a; border-color: #5d5dff; }
  .feed-header { display: flex; justify-content: space-between; align-items: center; }
  .feed-word { font-weight: 600; font-size: 15px; }
  .feed-score { color: #22ff88; font-size: 13px; font-weight: 600; }
  .feed-score.mid { color: #ffd93b; }
  .feed-score.low { color: #8888aa; }
  .feed-actions { display: flex; gap: 6px; }
  .feed-actions button {
    padding: 4px 8px; font-size: 11px; border-radius: 4px;
    background: #2d2d4a; border: 1px solid #3d3d5c; color: #ccc; cursor: pointer;
  }
  .feed-actions button:hover { background: #3d3d5c; color: white; }

  .line-text-pipeline {
    display: none; margin-bottom: 12px; padding: 10px;
    background: #1a1a2e; border: 1px solid #3d3d5c; border-radius: 6px;
    align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .line-text-pipeline.visible { display: flex; }
  .line-text-pipeline input {
    flex: 1; min-width: 200px; background: #15152a; color: #e8e8e8;
    border: 1px solid #3d3d5c; border-radius: 4px; padding: 6px 10px; font-size: 13px;
  }
  .line-text-pipeline input:focus { outline: none; border-color: #5d5dff; }
  .syllable-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .syllable-chip {
    background: #2d2d4a; border: 1px solid #3d3d5c; border-radius: 4px;
    padding: 2px 8px; font-size: 12px; transition: all 0.15s;
    display: flex; align-items: center; gap: 4px;
  }
  .syllable-chip.used { opacity: 0.3; text-decoration: line-through; }
  .syllable-chip .stress-mark { color: #ff6b6b; font-weight: 700; }

  button {
    background: #2d2d4a; color: #e8e8e8; border: 1px solid #3d3d5c;
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.15s;
  }
  button:hover { background: #3d3d5c; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: #2d2d4a; }

  /* СТРОКИ */
  .line {
    background: #202035; /* Чуть темнее для контраста */
    border: 1px solid #3d3d5c; border-radius: 10px;
    padding: 16px; margin-bottom: 16px; 
    transition: all 0.2s ease-in-out; /* Плавный переход при смене активной строки */
  }
  
  /* АКТИВНАЯ СТРОКА */
  .line.active { 
    background: #2b2b4a; /* Заметно светлее */
    border-color: #5d5dff; 
    box-shadow: 0 0 0 2px rgba(93, 93, 255, 0.4), 0 8px 20px rgba(0,0,0,0.3); 
  }
  
  .line-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .line-header-left { display: flex; gap: 12px; align-items: center; }
  
  .line-label { font-size: 14px; color: #8888aa; transition: all 0.2s; }
  .line.active .line-label { font-size: 16px; color: #ffffff; font-weight: 700; } /* Увеличиваем и делаем белым */
  
  .line-mode-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: #1a1a2e; color: #8888aa; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
    transition: all 0.2s;
  }
  .line.active .line-mode-tag { background: #3d3d5c; color: #e8e8e8; }

  .btn-delete-line {
    background: #4a2525; border-color: #6d3a3a; color: #ff8888;
    padding: 2px 8px; font-size: 12px; border-radius: 4px; cursor: pointer;
  }
  .btn-delete-line:hover { background: #6d3a3a; color: white; }

  .tacts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: stretch; }
  .tact {
    background: #1e1e33; border-radius: 8px; padding: 8px;
    border: 1px solid #2d2d4a; position: relative; display: flex; flex-direction: column;
    transition: background 0.15s;
  }
  .line.active .tact { background: #22223a; border-color: #3d3d5c; } /* Такты внутри активной строки тоже чуть светлеют */

  .tact.is-custom { border-color: #5d3d7a; }
  .tact-label {
    font-size: 11px; color: #7777aa; text-align: center; margin-bottom: 6px; padding: 4px;
    background: #15152a; border-radius: 4px; cursor: pointer; user-select: none; transition: all 0.15s; flex-shrink: 0;
  }
  .tact-label:hover { color: #9d9dff; background: #2a2a4a; }
  .tact.is-custom .tact-label { color: #d44cff; }

  .cells { display: grid; gap: 6px; flex: 1; align-content: center; padding-top: 6px; }
  .cells.size-2 { grid-template-columns: repeat(2, 1fr); }
  .cells.size-3 { grid-template-columns: repeat(3, 1fr); }
  .cells.size-4 { grid-template-columns: repeat(4, 1fr); }
  .cells.size-6 { grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .cells.size-8 { grid-template-columns: repeat(8, 1fr); gap: 2px; }

  .cell-container {
    position: relative;
    display: flex; justify-content: center; align-items: center;
    width: 100%; height: 100%;
  }

  .cell {
    width: 100%; height: 44px;
    max-width: 54px;
    border-radius: 6px; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    user-select: none; position: relative;
  }
  
  .cells.size-6 .cell { height: 38px; font-size: 12px; max-width: 46px; }
  .cells.size-8 .cell { height: 34px; font-size: 11px; max-width: 36px; padding: 0 2px; }

  .cell:hover { transform: scale(1.12); z-index: 5; }
  .cell.stressed { background: #ff6b6b; }
  .cell.unstressed { background: #4a4a6e; }
  .cell.empty { background: #15152a; border: 2px dashed #2d2d4a; }
  .cell.stress-wrong { box-shadow: 0 0 0 3px #ff9800, 0 0 12px 4px rgba(255, 152, 0, 0.6) !important; }

  /* СТРЕЛОЧКИ */
  .shift-arrows-wrapper {
    position: absolute;
    top: calc(100% + 4px);
    left: 50%; transform: translateX(-50%);
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 54px; height: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
    z-index: 20;
  }
  .cell-container.show-arrows:hover .shift-arrows-wrapper { opacity: 1; pointer-events: auto; }
  
  .shift-arrow {
    width: 20px; height: 20px; background: #2d2d4a; color: #9d9dff;
    border-radius: 4px; border: 1px solid #3d3d5c;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; font-weight: bold; padding: 0;
    transition: all 0.15s; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }
  .shift-arrow:hover { background: #5d5dff; color: white; border-color: #5d5dff; transform: scale(1.1); }

  .cell.template.mark-green { box-shadow: 0 0 0 5px #22ff88, 0 0 22px 7px rgba(34,255,136,0.85); }
  .cell.template.mark-blue { box-shadow: 0 0 0 5px #3bb2ff, 0 0 22px 7px rgba(59,178,255,0.85); }
  .cell.template.mark-purple { box-shadow: 0 0 0 5px #d44cff, 0 0 22px 7px rgba(212,76,255,0.85); }
  .cell.template.mark-yellow { box-shadow: 0 0 0 5px #ffd93b, 0 0 22px 7px rgba(255,217,59,0.85); }

  .cell.template::before {
    content: ''; position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
    width: 8px; height: 8px; border-radius: 50%; background: #ffffff;
    box-shadow: 0 0 8px 2px rgba(255,255,255,0.9); z-index: 6;
  }

  .cell.target.mark-green { box-shadow: 0 0 0 3px #22ff88, 0 0 10px 3px rgba(34,255,136,0.5); }
  .cell.target.mark-blue { box-shadow: 0 0 0 3px #3bb2ff, 0 0 10px 3px rgba(59,178,255,0.5); }
  .cell.target.mark-purple { box-shadow: 0 0 0 3px #d44cff, 0 0 10px 3px rgba(212,76,255,0.5); }
  .cell.target.mark-yellow { box-shadow: 0 0 0 3px #ffd93b, 0 0 10px 3px rgba(255,217,59,0.5); }

  .cell.mark-protected { animation: shake 0.3s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #ff3b3b; color: white; padding: 14px 24px; border-radius: 8px;
    font-size: 14px; font-weight: 500; box-shadow: 0 8px 32px rgba(255,59,59,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
    z-index: 3000; max-width: 600px; text-align: center; line-height: 1.4;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
  .toast.warning { background: #ffb020; box-shadow: 0 8px 32px rgba(255,176,32,0.5); }
  .toast.success { background: #22c55e; box-shadow: 0 8px 32px rgba(34,197,94,0.5); }

  .tact-menu {
    position: absolute; top: 44px; left: 0; background: #2a2a4a; border: 1px solid #5d5dff;
    border-radius: 8px; padding: 12px; z-index: 2000; min-width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .tact-menu h4 { font-size: 11px; color: #8888aa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .tact-menu select { width: 100%; background: #1e1e33; color: #e8e8e8; border: 1px solid #3d3d5c; border-radius: 4px; padding: 6px 8px; margin-bottom: 10px; font-size: 13px; }
  .tact-menu .close-menu { position: absolute; top: 6px; right: 8px; background: none; border: none; color: #8888aa; font-size: 16px; cursor: pointer; padding: 0; width: 20px; height: 20px; }
  .tact-menu .close-menu:hover { color: #ff6b6b; background: none; }

  /* ПАНЕЛЬ В */
  .panel-v {
    position: fixed; bottom: 0; left: 0; width: 100%;
    height: 160px; min-height: 80px; max-height: 80vh;
    background: #1e1e33; border-top: 2px solid #3d3d5c;
    display: flex; flex-direction: column; z-index: 500;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
  }
  .panel-v-resizer {
    height: 14px; width: 100%; cursor: ns-resize;
    background: #252540; border-bottom: 1px solid #3d3d5c;
    display: flex; justify-content: center; align-items: center;
    position: relative; transition: background 0.15s;
  }
  .panel-v-resizer::before {
    content: ''; width: 44px; height: 4px;
    background: #5d5dff; border-radius: 2px;
    box-shadow: 0 0 8px rgba(93, 93, 255, 0.6); transition: all 0.15s;
  }
  .panel-v-resizer:hover { background: #2d2d4a; }
  .panel-v-resizer:hover::before { width: 60px; background: #9d9dff; box-shadow: 0 0 12px rgba(157, 157, 255, 0.9); }
  
  .panel-v-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 20px; background: #252540; border-bottom: 1px solid #3d3d5c;
  }
  .panel-v-header h4 { font-size: 13px; color: #9d9dff; margin: 0; }
  .panel-v-content { flex: 1; padding: 10px 20px; display: flex; overflow: hidden; }
  .panel-v-content textarea {
    flex: 1; width: 100%; height: 100%; background: transparent; color: #e8e8e8;
    border: none; resize: none; font-family: monospace; font-size: 16px;
    line-height: 1.5; outline: none; overflow-y: auto;
  }
  .panel-v-content textarea::-webkit-scrollbar { width: 8px; }
  .panel-v-content textarea::-webkit-scrollbar-track { background: #1a1a2e; border-radius: 4px; }
  .panel-v-content textarea::-webkit-scrollbar-thumb { background: #3d3d5c; border-radius: 4px; }
  .panel-v-content textarea::-webkit-scrollbar-thumb:hover { background: #5d5dff; }
</style>
</head>
<body>

<h1>🎵 Студия ритмики — прототип v33</h1>

<div class="studio-layout">
  <div class="panel-a">
    <div class="toolbar-top">
      <button class="tool-btn active" data-tool="pencil">✏️ Карандаш</button>
      <button class="tool-btn" data-tool="text">📝 Текст</button>
      <button class="tool-btn" data-tool="marker">🖍️ Маркер Рифмы</button>
      <div class="separator"></div>
      <button id="btn-add-line">+ Строка</button>
      <button id="btn-undo" title="Ctrl+Z">↶ Undo</button>
      <button id="btn-redo" title="Ctrl+Y / Ctrl+Shift+Z">↷ Redo</button>
      <button id="btn-reset-patterns">✕ Сбросить шаблоны</button>
    </div>
    <div id="canvas"></div>
  </div>

  <div class="panel-b">
    <h3>🔎 Поиск рифм</h3>
    <div class="panel-section">
      <div class="section-label">Цвета маркеров</div>
      <div class="color-palette" id="palette">
        <div class="color-dot green" data-color="green" title="Зелёный"></div>
        <div class="color-dot blue" data-color="blue" title="Синий"></div>
        <div class="color-dot purple" data-color="purple" title="Фиолетовый"></div>
        <div class="color-dot yellow" data-color="yellow" title="Жёлтый"></div>
      </div>
    </div>

    <div class="panel-section">
      <input type="text" id="search-input" placeholder="Слово для рифмы..." />
      <div class="btn-group">
        <button class="btn-primary" id="btn-search">Найти рифму</button>
        <button id="btn-fill-line">Заполнить строку</button>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="chk-profanity" />
        Разрешить мат
      </label>
    </div>
    
    <div class="rhyme-feed" id="rhyme-feed">
      <div style="text-align:center; color:#7777aa; font-size:13px; margin-top:20px;">Введите слово и нажмите «Найти»</div>
    </div>
  </div>
</div>

<div class="panel-v" id="panel-v">
  <div class="panel-v-resizer" id="panel-v-resizer"></div>
  <div class="panel-v-header">
    <h4>📄 Текст куплета</h4>
    <div style="display:flex; gap:8px;">
      <button id="btn-copy-verse" class="btn-primary" style="padding:4px 12px; font-size:12px;">Скопировать</button>
    </div>
  </div>
  <div class="panel-v-content">
    <textarea id="verse-text" readonly placeholder="Здесь будет собираться текст куплета..."></textarea>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MOCK_DATA = {
  "чилить": [ { word: "читер", score: 66 }, { word: "кинуть", score: 49 }, { word: "чипок", score: 48 }, { word: "имидж", score: 45 }, { word: "скинуть", score: 42 } ],
  "вайб": [ { word: "свайп", score: 81 }, { word: "хайп", score: 58 }, { word: "враг", score: 43 }, { word: "фанк", score: 43 } ]
};

const PATTERNS_BY_SIZE = {
  2: { 'Хорей': [true,false], 'Ямб': [false,true] },
  3: { 'Дактиль': [true,false,false], 'Амфибрахий': [false,true,false], 'Анапест': [false,false,true], 'Хорей': [true,false,true], 'Ямб': [false,true,false] },
  4: { 'Хорей': [true,false,true,false], 'Ямб': [false,true,false,true], 'Дактиль': [true,false,false,true] },
  6: { 'Хорей': [true,false,true,false,true,false], 'Ямб': [false,true,false,true,false,true], 'Дактиль': [true,false,false,true,false,false], 'Амфибрахий': [false,true,false,false,true,false], 'Анапест': [false,false,true,false,false,true] },
  8: { 'Хорей': [true,false,true,false,true,false,true,false], 'Дактиль': [true,false,false,true,false,false,true,false] },
};
const AVAILABLE_SIZES = [2, 3, 4, 6, 8];
const MARKER_COLORS = ['green', 'blue', 'purple', 'yellow'];
const VOWELS = 'аеёиоуыэюя';
const STORAGE_KEY = 'rhymemaster_studio_state_v1';

let nextGroupId = 1;

const state = {
  lines: [], activeLine: 0,
  tool: 'pencil', markerColor: 'green',
  history: [], future: [],
  markerTemplates: { green: null, blue: null, purple: null, yellow: null }
};

function splitIntoSyllables(text) {
  if (!text) return [];
  const cleanText = text.replace(/[\s\-]+/g, '');
  if (!cleanText) return [];
  const hasApostrophe = /['’]/.test(cleanText);
  const parts = [];
  let current = '', currentStressed = false;
  for (let i = 0; i < cleanText.length; i++) {
    let ch = cleanText[i];
    if (ch === "'" || ch === '’') { currentStressed = true; continue; }
    if (VOWELS.includes(ch.toLowerCase()) && /[аеёиоуыэюя]/i.test(current)) {
      parts.push({ text: current, stressed: hasApostrophe ? currentStressed : null });
      current = ch; currentStressed = false;
    } else { current += ch; }
  }
  if (current) parts.push({ text: current, stressed: hasApostrophe ? currentStressed : null });
  for (let i = 0; i < parts.length - 1; i++) {
    const next = parts[i+1];
    if (next && VOWELS.includes(next.text[0].toLowerCase())) {
      const cur = parts[i], lastChar = cur.text[cur.text.length - 1];
      if (lastChar && !VOWELS.includes(lastChar.toLowerCase())) {
        cur.text = cur.text.slice(0, -1);
        next.text = lastChar + next.text;
      }
    }
  }
  return parts.filter(p => p.text.length > 0);

  line.tacts.forEach((t, tIdx) => {
    getActiveTact(t).cells.forEach((c, cIdx) => {
      flatCells.push({ cell: c, tactIdx: tIdx, cellIdx: cIdx });

  });

  const currentFlatIdx = flatCells.findIndex(c => c.tactIdx === tactIdx && c.cellIdx === cellIdx);
  if (currentFlatIdx === -1) return;

  act(() => {
    const source = flatCells[currentFlatIdx];
    let carryText = source.cell.text;
    let carryStress = source.cell.textStress;
    
    source.cell.text = null;
    source.cell.textStress = null;
    source.cell.stressWrong = false;

    if (dir === 1) {
      for (let i = currentFlatIdx + 1; i < flatCells.length; i++) {
        const target = flatCells[i];
        const tempText = target.cell.text;
        const tempStress = target.cell.textStress;

        target.cell.text = carryText;
        target.cell.textStress = carryStress;
        target.cell.stressWrong = computeStressWrong(target.cell.state, target.cell.textStress);

        carryText = tempText;
        carryStress = tempStress;
      }
    } else {
      for (let i = currentFlatIdx - 1; i >= 0; i--) {
        const target = flatCells[i];
        const tempText = target.cell.text;
        const tempStress = target.cell.textStress;

        target.cell.text = carryText;
        target.cell.textStress = carryStress;
        target.cell.stressWrong = computeStressWrong(target.cell.state, target.cell.textStress);

    } else {

    updateToolbarUI(); return;
  }
  if (state.tool === 'marker') {
    const color = cell.mark; if (!color) return;
    if (!isMarkerEdgeOfGroup(lineIdx, tactIdx, cellIdx, color)) { showToast('Снимать маркер можно только с края группы.'); flashProtected(lineIdx, tactIdx, cellIdx); return; }
    act(() => {
      cell.mark = null; cell.markGroup = null;
      const reason = validateColorGroups(color);
      if (reason) showToast('Группа сброшена.', 'warning');
      render();
    });
    updateToolbarUI();
  }
}

let openMenu = null;
function closeTactMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
function openTactMenu(lineIdx, tactIdx, anchorEl) {
  closeTactMenu();
  const tact = state.lines[lineIdx].tacts[tactIdx];
  const menu = document.createElement('div'); menu.className = 'tact-menu';
  const patternsForSize = Object.keys(PATTERNS_BY_SIZE[tact.size] || {});
  const currentValue = tact.mode === 'custom' ? 'Кастомный' : tact.standard.pattern;
  let html = `<button class="close-menu">×</button><h4>Размер такта</h4><select id="size-select">${AVAILABLE_SIZES.map(s => `<option value="${s}" ${s === tact.size ? 'selected' : ''}>${s}/4</option>`).join('')}</select>`;
  html += `<h4>Режим такта</h4><select id="mode-select">${patternsForSize.map(p => `<option value="${p}" ${p === currentValue ? 'selected' : ''}>${p}</option>`).join('')}<option value="Кастомный" ${currentValue === 'Кастомный' ? 'selected' : ''}>Кастомный</option></select>`;
  html += `<button id="btn-clear-tact" style="width:100%;background:#4a2525;border-color:#6d3a3a;">Очистить такт</button>`;
  menu.innerHTML = html;
  menu.querySelector('.close-menu').addEventListener('click', (e) => { e.stopPropagation(); closeTactMenu(); });
  menu.querySelector('#size-select').addEventListener('change', (e) => { changeTactSize(lineIdx, tactIdx, parseInt(e.target.value)); openTactMenu(lineIdx, tactIdx, anchorEl); });
  menu.querySelector('#mode-select').addEventListener('change', (e) => { changeTactMode(lineIdx, tactIdx, e.target.value); openTactMenu(lineIdx, tactIdx, anchorEl); });
  menu.querySelector('#btn-clear-tact').addEventListener('click', (e) => { e.stopPropagation(); clearTact(lineIdx, tactIdx); closeTactMenu(); });
  menu.addEventListener('click', (e) => e.stopPropagation());
  anchorEl.parentElement.appendChild(menu); openMenu = menu;
}

function render() {
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';
  state.lines.forEach((line, lineIdx) => {
    const lineEl = document.createElement('div');
    lineEl.className = 'line' + (lineIdx === state.activeLine ? ' active' : '');
    
    const header = document.createElement('div');
    header.className = 'line-header';
    header.innerHTML = `
      <div class="line-header-left">
        <span class="line-label">Строка ${lineIdx + 1}</span>
        <span class="line-mode-tag">${isLineCustom(line) ? 'Кастомная' : 'Стандартная'}</span>
      </div>
      <button class="btn-delete-line" title="Удалить строку">✕</button>
    `;
    header.querySelector('.btn-delete-line').addEventListener('click', (e) => deleteLine(lineIdx, e));
    lineEl.appendChild(header);
    
    const pipelineEl = document.createElement('div');
    pipelineEl.className = 'line-text-pipeline' + (state.tool === 'text' ? ' visible' : '');
    
    const inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.placeholder = 'Введите слово (апостроф = ударение)';
    inputEl.value = line.textPipeline.rawText || '';
    inputEl.addEventListener('input', (e) => {
      const targetLine = state.lines[lineIdx];
      targetLine.textPipeline.rawText = e.target.value;
      targetLine.textPipeline.syllables = splitIntoSyllables(e.target.value);
      updateLineChipsUI(lineIdx); saveToLocalStorage();
    });
    
    const chipsEl = document.createElement('div');
    chipsEl.className = 'syllable-chips';
    
    pipelineEl.appendChild(inputEl);
    pipelineEl.appendChild(chipsEl);
    lineEl.appendChild(pipelineEl);
    
    const tactsEl = document.createElement('div'); tactsEl.className = 'tacts';
    line.tacts.forEach((tact, tactIdx) => {
      const active = getActiveTact(tact);
      const tactEl = document.createElement('div');
      tactEl.className = 'tact' + (tact.mode === 'custom' ? ' is-custom' : '');
      const label = document.createElement('div'); label.className = 'tact-label';
      label.textContent = tact.mode === 'custom' ? `Кастомный ${tact.size}/4` : `${tact.standard.pattern} ${tact.size}/4`;
      label.addEventListener('click', (e) => { e.stopPropagation(); setActiveLine(lineIdx); openTactMenu(lineIdx, tactIdx, label); });
      tactEl.appendChild(label);
      
      const cellsEl = document.createElement('div'); cellsEl.className = 'cells size-' + tact.size;
      
      active.cells.forEach((cell, cellIdx) => {
        const cellContainer = document.createElement('div');
        // Добавляем класс, если активен инструмент "Текст"
        cellContainer.className = 'cell-container' + (state.tool === 'text' ? ' show-arrows' : '');

        const cellEl = document.createElement('div');
        let cls = 'cell ' + cell.state;
        if (cell.mark) {
          cls += ' mark-' + cell.mark;
          if (state.markerTemplates[cell.mark]?.groupId === cell.markGroup) cls += ' template'; else cls += ' target';
        }
        if (cell.stressWrong) cls += ' stress-wrong';
        cellEl.className = cls;
        cellEl.textContent = cell.text || '';

        cellEl.addEventListener('mousedown', (e) => onCellMouseDown(lineIdx, tactIdx, cellIdx, e));
        cellEl.addEventListener('mouseenter', () => onCellMouseEnter(lineIdx, tactIdx, cellIdx));
        cellEl.addEventListener('mouseup', () => onCellMouseUp());
        cellEl.addEventListener('contextmenu', (e) => onCellContextMenu(lineIdx, tactIdx, cellIdx, e));

        cellContainer.appendChild(cellEl);

        // Стрелочки рендерим, только если есть текст
        if (cell.text) {
          const arrowsEl = document.createElement('div');
          arrowsEl.className = 'shift-arrows-wrapper';
          
          const leftArrow = document.createElement('button');
          leftArrow.className = 'shift-arrow';
          leftArrow.innerHTML = '‹';
          leftArrow.addEventListener('mousedown', (e) => { e.stopPropagation(); shiftCellText(lineIdx, tactIdx, cellIdx, -1); });
          
          const rightArrow = document.createElement('button');
          rightArrow.className = 'shift-arrow';
          rightArrow.innerHTML = '›';
          rightArrow.addEventListener('mousedown', (e) => { e.stopPropagation(); shiftCellText(lineIdx, tactIdx, cellIdx, 1); });
          
          arrowsEl.appendChild(leftArrow);
          arrowsEl.appendChild(rightArrow);
          cellContainer.appendChild(arrowsEl);
        }

        cellsEl.appendChild(cellContainer);
      });
      tactEl.appendChild(cellsEl); tactsEl.appendChild(tactEl);
    });
    lineEl.appendChild(tactsEl);
    lineEl.addEventListener('click', () => setActiveLine(lineIdx));
    canvas.appendChild(lineEl);
    
    updateLineChipsUI(lineIdx);
  });
  updateUndoRedoButtons();
  updatePanelV();
}

function updateLineChipsUI(lineIdx) {
  const lineEl = document.getElementById('canvas').children[lineIdx];
  if (!lineEl) return;
  const chipsEl = lineEl.querySelector('.syllable-chips');
  if (!chipsEl) return;
  
  chipsEl.innerHTML = '';
  const line = state.lines[lineIdx];
  
  const cellCounts = {};
  state.lines.forEach(l => l.tacts.forEach(tact => getActiveTact(tact).cells.forEach(c => { if (c.text) cellCounts[c.text] = (cellCounts[c.text] || 0) + 1; })));
  const tempCounts = { ...cellCounts };
  
  line.textPipeline.syllables.forEach((syl) => {
    const chip = document.createElement('span');
    let isUsed = false;
    if (tempCounts[syl.text] > 0) { tempCounts[syl.text]--; isUsed = true; }
    chip.className = 'syllable-chip' + (isUsed ? ' used' : '');
    chip.innerHTML = syl.text + (syl.stressed ? '<span class="stress-mark">´</span>' : '');
    chipsEl.appendChild(chip);
  });
}

function updatePanelV() {
  const textarea = document.getElementById('verse-text');
  if (!textarea) return;
  const linesText = [];
  state.lines.forEach((line) => {
    const lineSyllables = [];
    line.tacts.forEach(tact => {
      getActiveTact(tact).cells.forEach(cell => {
        if (cell.text) lineSyllables.push(cell.text);
      });
    });
    if (lineSyllables.length > 0) linesText.push(lineSyllables.join(' ')); 
  });
  textarea.value = linesText.join('\n');
}

function updateToolbarUI() {
  document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tool === state.tool));
  document.querySelectorAll('.color-dot').forEach(dot => {
    const color = dot.dataset.color;
    dot.classList.toggle('active', state.tool === 'marker' && color === state.markerColor);
    let badge = dot.querySelector('.pattern-badge');
    const tpl = state.markerTemplates[color];
    if (tpl) {
      if (!badge) { badge = document.createElement('span'); badge.className = 'pattern-badge'; dot.appendChild(badge); }
      badge.textContent = `${tpl.length}: ${describeTemplate(tpl)}`;
    } else if (badge) badge.remove();
  });
  updateUndoRedoButtons();
}

// --- РЕСАЙЗ ПАНЕЛИ В ---
const resizer = document.getElementById('panel-v-resizer');
const panelV = document.getElementById('panel-v');
let isResizing = false;
let startY, startHeight;

resizer.addEventListener('mousedown', (e) => {
  isResizing = true;
  startY = e.clientY;
  startHeight = parseInt(document.defaultView.getComputedStyle(panelV).height, 10);
  document.body.style.cursor = 'ns-resize';
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const dy = startY - e.clientY;
  const newHeight = Math.max(80, Math.min(startHeight + dy, window.innerHeight * 0.8));
  panelV.style.height = newHeight + 'px';
  document.body.style.paddingBottom = (newHeight + 20) + 'px';
});

document.addEventListener('mouseup', () => {
  if (isResizing) { isResizing = false; document.body.style.cursor = ''; }
});

document.getElementById('btn-copy-verse').addEventListener('click', () => {
  const textarea = document.getElementById('verse-text');
  if (!textarea.value.trim()) { showToast('Текст пуст', 'warning'); return; }
  navigator.clipboard.writeText(textarea.value).then(() => {
    showToast('Текст скопирован!', 'success');
  }).catch(err => showToast('Ошибка при копировании', 'error'));
});

// --- ПОИСК В ПАНЕЛИ Б ---
document.getElementById('btn-search').addEventListener('click', () => {
  const query = document.getElementById('search-input').value.trim().toLowerCase();
  const feed = document.getElementById('rhyme-feed');
  
  if (!query) return;
  
  if (MOCK_DATA[query]) {
    feed.innerHTML = '';
    MOCK_DATA[query].forEach(item => {
      const el = document.createElement('div');
      el.className = 'feed-item';
      let scoreClass = item.score >= 80 ? '' : (item.score >= 50 ? ' mid' : ' low');
      
      const header = document.createElement('div');
      header.className = 'feed-header';
      header.innerHTML = `<span class="feed-word">${item.word}</span><span class="feed-score${scoreClass}">${item.score}%</span>`;
      
      const actions = document.createElement('div');
      actions.className = 'feed-actions';
      
      const btnText = document.createElement('button');
      btnText.textContent = 'В текст';
      btnText.onclick = () => {
        const line = state.lines[state.activeLine];
        if (!line) return;
        const currentText = line.textPipeline.rawText.trim();
        line.textPipeline.rawText = currentText ? `${currentText} ${item.word}` : item.word;
        line.textPipeline.syllables = splitIntoSyllables(line.textPipeline.rawText);
        setTool('text');
        render();
        showToast(`Слово "${item.word}" добавлено в конвейер`, 'success');
      };
      
      const btnCells = document.createElement('button');
      btnCells.textContent = 'Расставить по ячейкам';
      btnCells.onclick = () => {
        const line = state.lines[state.activeLine];
        if (!line) return;
        const syllables = splitIntoSyllables(item.word);
        if (syllables.length === 0) return;

        const currentText = line.textPipeline.rawText.trim();
        if (!currentText.includes(item.word)) {
          line.textPipeline.rawText = currentText ? `${currentText} ${item.word}` : item.word;
          line.textPipeline.syllables = splitIntoSyllables(line.textPipeline.rawText);
        }

        const cellCounts = {};
        state.lines.forEach(l => l.tacts.forEach(tact => getActiveTact(tact).cells.forEach(c => { if (c.text) cellCounts[c.text] = (cellCounts[c.text] || 0) + 1; })));
        const tempCounts = { ...cellCounts };
        const remainingSyls = [];
        for (const syl of line.textPipeline.syllables) {
          if (tempCounts[syl.text] > 0) tempCounts[syl.text]--;
          else remainingSyls.push(syl);
        }
        if (remainingSyls.length === 0) { showToast('Все слоги этого слова уже расставлены', 'warning'); return; }

        let sylIdx = 0, placed = 0;
        act(() => {
          for (let t = 0; t < line.tacts.length; t++) {
            const active = getActiveTact(line.tacts[t]);
            for (let c = 0; c < active.cells.length; c++) {
              if (sylIdx >= remainingSyls.length) break;
              const cell = active.cells[c];
              if (cell.state !== 'empty' && !cell.text) {
                const syl = remainingSyls[sylIdx];
                cell.text = syl.text; cell.textStress = syl.stressed;
                cell.stressWrong = computeStressWrong(cell.state, syl.stressed);
                sylIdx++; placed++;
              }
            }
            if (sylIdx >= remainingSyls.length) break;
          }
          render();
        });
        if (placed > 0) showToast(`Расставлено слогов: ${placed}`, 'success');
        else showToast('Нет свободных ячеек в активной строке', 'warning');
      };

      actions.appendChild(btnText);
      actions.appendChild(btnCells);
      el.appendChild(header);
      el.appendChild(actions);
      feed.appendChild(el);
    });
  } else {
    feed.innerHTML = '<div style="text-align:center; color:#7777aa; font-size:13px; margin-top:20px;">Ничего не найдено (попробуйте «чилить» или «вайб»)</div>';
  }
});

document.getElementById('search-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('btn-search').click();
});

document.getElementById('btn-fill-line').addEventListener('click', () => { showToast('Функция «Заполнить строку» в разработке', 'warning'); });
document.getElementById('btn-add-line').addEventListener('click', addLine);
document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-redo').addEventListener('click', redo);
document.getElementById('btn-reset-patterns').addEventListener('click', () => { act(() => { MARKER_COLORS.forEach(c => state.markerTemplates[c] = null); updateToolbarUI(); render(); showToast('Шаблоны сброшены', 'warning'); }); });
document.querySelectorAll('.color-dot').forEach(dot => dot.addEventListener('click', () => { setMarkerColor(dot.dataset.color); setTool('marker'); }));
document.querySelectorAll('.tool-btn').forEach(btn => btn.addEventListener('click', () => setTool(btn.dataset.tool)));

document.addEventListener('keydown', (e) => {
  const isCtrl = e.ctrlKey || e.metaKey;
  if (isCtrl && !e.shiftKey && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) { e.preventDefault(); undo(); return; }
  if (isCtrl && (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н')) { e.preventDefault(); redo(); return; }
  if (isCtrl && e.shiftKey && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) { e.preventDefault(); redo(); return; }
  if (e.key === 'Escape') closeTactMenu();
});

document.addEventListener('click', (e) => { if (openMenu && !openMenu.contains(e.target)) closeTactMenu(); });
document.getElementById('canvas').addEventListener('contextmenu', (e) => e.preventDefault());

if (!loadFromLocalStorage()) state.lines.push(createLine());
render(); updateToolbarUI();
</script>
</body>
</html>
